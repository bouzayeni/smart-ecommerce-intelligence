[project]
name = "smart-ecommerce-intelligence"
version = "0.1.0"
description = "End-to-end e-commerce analytics, ML and BI platform built on the Olist public dataset."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2,<4",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "pandera[pandas]>=0.20",
]

[dependency-groups]
backend = [
    "alembic>=1.14",
    "anthropic>=1.0",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "slowapi>=0.1.9",
    "sqlglot>=26",
    "uvicorn[standard]>=0.32",
]
dbt = [
    "dbt-core>=1.9,<2",
    "dbt-postgres>=1.9,<2",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pre-commit>=3.8",
]
dl = [
    "prophet>=1.1.6",
    "statsmodels>=0.14",
    "tensorflow>=2.18",
]
ml = [
    "matplotlib>=3.9",
    "mlflow>=2.17",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "xgboost>=2.1",
]
notebooks = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbconvert>=7.16",
    "nbformat>=5.10",
]

[tool.uv]
# Not an installable package: modules are run from the repo root (`python -m ...`).
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = [".", "backend"]
# importlib mode: tests/ and backend/tests/ are both named "tests"; load files by path.
addopts = "-ra --import-mode=importlib"
markers = [
    "db: requires a running PostgreSQL instance (docker compose up -d postgres)",
    "llm: calls the real LLM API (costs money); run with RUN_LLM_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.isort]
# mlflow/ (data) and backend/alembic/ (migrations) are folders, not the packages.
known-third-party = ["mlflow", "alembic"]
known-first-party = ["app", "ml", "data_engineering"]

[tool.ruff.lint.per-file-ignores]
# One-off report script: long f-string report lines are clearer unwrapped.
"data_engineering/scripts/profile_raw.py" = ["E501"]
