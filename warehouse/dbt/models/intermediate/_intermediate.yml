version: 2

models:
  - name: int_order_item_totals
    description: Per-order item aggregates (one row per order with items).
    columns:
      - name: order_id
        data_tests: [unique, not_null]

  - name: int_order_payment_totals
    description: Per-order payment aggregates; primary_payment_type carries the largest value.
    columns:
      - name: order_id
        data_tests: [unique, not_null]

  - name: int_order_reviews
    description: The most recently answered review per order (BR-06).
    columns:
      - name: order_id
        data_tests: [unique, not_null]

  - name: int_orders_enriched
    description: Every order with totals, customer identity and business-rule flags.
    data_tests:
      - row_count_matches: {arguments: {compare_to: ref('stg_orders')}}
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]

  - name: int_geolocation_by_zip
    description: One row per zip prefix with median coordinates (BR-09).
    columns:
      - name: zip_code_prefix
        data_tests: [unique, not_null]

  - name: int_customers_profile
    description: One row per person with latest location and order statistics.
    columns:
      - name: customer_unique_id
        data_tests: [unique, not_null]
