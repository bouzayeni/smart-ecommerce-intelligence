name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python and dependencies (runtime + dev)
        run: uv sync --locked --group backend --group ml
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      # Tests marked `db` need the loaded warehouse (Kaggle data, not in the repo) and run
      # locally; everything else runs here: ETL contracts, SQL guard, promotion gate, ...
      - name: Unit tests and sample-fixture data checks
        run: uv run pytest -m "not db and not llm"
      - name: Data quality checks on sample fixture
        run: uv run python -m data_engineering.scripts.assess_quality --raw-dir data/sample
      - name: dbt parse (compiles the project; no database needed)
        env:
          POSTGRES_DB: ci
          ETL_DB_USER: ci
          ETL_DB_PASSWORD: ci
        run: |
          uv sync --locked --group dbt
          uv run --group dbt python -m data_engineering.scripts.run_dbt parse

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and lint
        run: |
          npm run typecheck
          npx eslint . --max-warnings 0
      - name: Production build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the history
      - uses: astral-sh/setup-uv@v5
      - name: Python dependency audit (runtime groups)
        run: |
          uv export --locked --no-dev --group backend --group ml --no-hashes \
            --format requirements-txt -o runtime.txt
          uvx --from pip-audit==2.9.0 pip-audit -r runtime.txt --no-deps --disable-pip
      - name: Static analysis (bandit, medium+ severity and confidence)
        run: uvx --from bandit==1.8.6 bandit -q -r backend/app ml data_engineering -ll -ii
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api/Dockerfile
          tags: sei-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web/Dockerfile
          tags: sei-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: API image starts and answers /api/health
        run: |
          docker run -d --name api -p 8000:8000 \
            -e JWT_SECRET_KEY="$(openssl rand -hex 32)" sei-api:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && exit 0; sleep 2; done
          docker logs api; exit 1
      - name: Image vulnerability scan (fixable HIGH/CRITICAL fail the build)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: sei-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Web image vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: sei-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
