name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit tests and sample-fixture data checks
        run: uv run pytest -m "not db"
      - name: Data quality checks on sample fixture
        run: uv run python -m data_engineering.scripts.assess_quality --raw-dir data/sample
      - name: dbt parse (compiles the project; no database needed)
        env:
          POSTGRES_DB: ci
          ETL_DB_USER: ci
          ETL_DB_PASSWORD: ci
        run: |
          uv sync --locked --group dbt
          uv run --group dbt python -m data_engineering.scripts.run_dbt parse

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and lint
        run: |
          npm run typecheck
          npx eslint . --max-warnings 0
      - name: Production build
        run: npm run build
